# App plus the Postgres file. One command starts both.
#
#   docker compose up --build
#
# On this machine, open http://localhost:8080. The port is bound to localhost
# so a remote nginx can proxy it without leaving the app on the public internet.
# For that host, set BETTER_AUTH_URL to the https origin before starting:
#
#   export BETTER_AUTH_URL=https://books.example.com
#   export BETTER_AUTH_SECRET="$(openssl rand -base64 32)"
#   docker compose up --build -d
name: honeyjar

include:
  - compose.postgres.yaml

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://honeyjar:honeyjar@postgres:5432/honeyjar
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-honeyjar-dev-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
