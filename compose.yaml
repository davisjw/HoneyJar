# App plus the Postgres file. One command starts both.
#
#   docker compose up --build
#
# The app port is published on localhost unless HONEYJAR_PUBLISH is set.
# When nginx is on another machine, publish the app host's private address
# and allow only that nginx host through the firewall:
#
#   export HONEYJAR_PUBLISH=10.0.0.5:8080
#   export BETTER_AUTH_URL=https://books.example.com
#   export BETTER_AUTH_SECRET="$(openssl rand -base64 32)"   # optional
#   docker compose up --build -d
#
# If BETTER_AUTH_SECRET is unset, the app generates one on first start and
# keeps it in the honeyjar-auth volume. The public default is not used.
# A compose.override.yaml next to this file is local and gitignored. Compose
# loads it when it exists and does not fail when it does not. See
# compose.override.example.yaml. Do not include that file from here: include
# requires the path to exist.
name: honeyjar

include:
  - compose.postgres.yaml

services:
  app:
    build: .
    ports:
      - "${HONEYJAR_PUBLISH:-127.0.0.1:8080}:8080"
    environment:
      DATABASE_URL: postgres://honeyjar:honeyjar@postgres:5432/honeyjar
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_LABEL: ${OIDC_LABEL:-}
      OIDC_PKCE: ${OIDC_PKCE:-}
    volumes:
      - honeyjar-files:/app/data/files
      - honeyjar-auth:/app/data/auth
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  honeyjar-files:
  honeyjar-auth:
