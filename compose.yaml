# App plus the Postgres file. One command starts both.
#
#   docker compose up --build
#
# The app port is published on localhost unless HONEYJAR_PUBLISH is set.
# When nginx is on another machine, publish the app host's private address
# and allow only that nginx host through the firewall:
#
#   export HONEYJAR_PUBLISH=10.0.0.5:8080
#   export BETTER_AUTH_URL=https://books.example.com
#   export BETTER_AUTH_SECRET="$(openssl rand -base64 32)"
#   docker compose up --build -d
name: honeyjar

include:
  - compose.postgres.yaml

services:
  app:
    build: .
    ports:
      - "${HONEYJAR_PUBLISH:-127.0.0.1:8080}:8080"
    environment:
      DATABASE_URL: postgres://honeyjar:honeyjar@postgres:5432/honeyjar
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-honeyjar-dev-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
